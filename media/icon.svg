  <path fill-rule="evenodd" d="M16 3 h3 a3 3 0 0 1 3 3 v2.5 a3 3 0 0 1 -3 3 h-3 a3 3 0 0 1 -3 -3 V6 a3 3 0 0 1 3 -3 z M17 5 h1.5 a1.5 1.5 0 0 1 1.5 1.5 v1.5 a1.5 1.5 0 0 1 -1.5 1.5 h-1.5 a1.5 1.5 0 0 1 -1.5 -1.5 v-1.5 A1.5 1.5 0 0 1 17 5 z"/>
