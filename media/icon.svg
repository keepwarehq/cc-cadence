<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- ccprofile: one chat, many profiles. Solid bubble = the active conversation; outlined bubble = another profile. VS Code uses the icon as an alpha mask, so only shapes matter. -->
