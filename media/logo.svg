<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24">
  <title>CC Cadence</title>
  <!-- Colored cadence meter for the editor tab icon, gallery icon, and panel. Tech-blue gradient. -->
  <defs>
    <linearGradient id="cad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B9EFF"/>
      <stop offset="1" stop-color="#1D5FE0"/>
    </linearGradient>
  </defs>
  <g fill="url(#cad)">
    <rect x="3.2"  y="8"    width="3" height="8"  rx="1.5"/>
    <rect x="8.4"  y="3.5"  width="3" height="17" rx="1.5"/>
    <rect x="13.6" y="9.5"  width="3" height="5"  rx="1.5"/>
    <rect x="18.8" y="6"    width="3" height="12" rx="1.5"/>
  </g>
</svg>
